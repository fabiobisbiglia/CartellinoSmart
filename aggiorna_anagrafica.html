<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Aggiorna anagrafica cartellini</title>
<style>body{font-family:Calibri,Arial,sans-serif;max-width:720px;margin:24px auto;padding:0 14px}
button{font-size:16px;padding:10px 18px;margin-top:10px;cursor:pointer}.ok{color:#1b7f3b;font-weight:bold}.err{color:#b00020;font-weight:bold}
.box{background:#f2f5f7;border:1px solid #cfd8dc;border-radius:6px;padding:12px;margin:12px 0}</style></head><body>
<h2>Aggiorna anagrafica cartellini</h2>
<div class="box"><b>1.</b> Seleziona il file <code>LISTA_MATERIALI_STOCK.xlsx</code> (colonna A codice, B descrizione, C stock).<br>
<input type="file" id="f" accept=".xlsx,.csv"></div>
<div id="o" class="box">In attesa del file...</div>
<div class="box"><b>2.</b> Scarica il nuovo file e sostituisci <code>anagrafica.js</code> nella cartella condivisa del generatore.<br>
<button id="d" disabled>Scarica anagrafica.js</button></div>
<script>
String.prototype.trim=function(){return this.replace(/^[\s\u00A0\u200B-\u200F\u2060\uFEFF]+|[\s\u00A0\u200B-\u200F\u2060\uFEFF]+$/g,'')};
var rows=[],o=document.getElementById('o'),d=document.getElementById('d');
function u16(b,i){return b[i]|b[i+1]<<8}function u32(b,i){return(b[i]|b[i+1]<<8|b[i+2]<<16|b[i+3]*16777216)>>>0}
async function unzip(buf){
 var b=new Uint8Array(buf),e=b.length-22;
 while(e>=0&&u32(b,e)!==0x06054b50)e--;
 if(e<0)throw new Error('file non valido');
 var n=u16(b,e+10),p=u32(b,e+16),files={},dec=new TextDecoder();
 for(var i=0;i<n;i++){
  var m=u16(b,p+10),cs=u32(b,p+20),nl=u16(b,p+28),el=u16(b,p+30),cl=u16(b,p+32),lo=u32(b,p+42);
  var name=dec.decode(b.subarray(p+46,p+46+nl));
  files[name]={m:m,cs:cs,lo:lo};p+=46+nl+el+cl;
 }
 async function get(name){
  var f=files[name];if(!f)return null;
  var s=f.lo+30+u16(b,f.lo+26)+u16(b,f.lo+28),data=b.subarray(s,s+f.cs);
  if(f.m===0)return dec.decode(data);
  var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return dec.decode(await new Response(st).arrayBuffer());
 }
 return get;
}
function xml(t){return new DOMParser().parseFromString(t,'application/xml')}
async function readXlsx(buf){
 var get=await unzip(buf);
 var wb=xml(await get('xl/workbook.xml')),rel=xml(await get('xl/_rels/workbook.xml.rels'));
 var sheets=Array.prototype.map.call(wb.getElementsByTagName('sheet'),function(s){return{n:s.getAttribute('name'),id:s.getAttribute('r:id')}});
 var sh=sheets.filter(function(s){return s.n==='LISTA_MATERIALI_STOCK'})[0]||sheets[0];
 var target='';Array.prototype.forEach.call(rel.getElementsByTagName('Relationship'),function(r){if(r.getAttribute('Id')===sh.id)target=r.getAttribute('Target')});
 var path=target.charAt(0)==='/'?target.slice(1):'xl/'+target;
 var ss=[],sst=await get('xl/sharedStrings.xml');
 if(sst)Array.prototype.forEach.call(xml(sst).getElementsByTagName('si'),function(si){
  var t='';Array.prototype.forEach.call(si.getElementsByTagName('t'),function(x){if(x.parentNode.nodeName!=='rPh')t+=x.textContent});ss.push(t)});
 var cells=xml(await get(path)).getElementsByTagName('c'),map={},out=[];
 for(var i=0;i<cells.length;i++){
  var c=cells[i],r=c.getAttribute('r'),m=/^([A-C])(\d+)$/.exec(r);if(!m)continue;
  var t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],val='';
  if(t==='inlineStr')val=c.textContent;else if(v){val=v.textContent;if(t==='s')val=ss[+val]||''}
  var rn=+m[2];(map[rn]=map[rn]||['','',''])['ABC'.indexOf(m[1])]=val;
 }
 Object.keys(map).map(Number).sort(function(a,b){return a-b}).forEach(function(k){out.push(map[k])});
 return{rows:out,sheet:sh.n};
}
function csv(t){var sep=(t.split(';').length>t.split(',').length)?';':',';return t.split(/\r?\n/).map(function(l){var a=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch=='"')q=!q;else if(ch==sep&&!q){a.push(c);c=''}else c+=ch}a.push(c);return a})}
function done(r,n){
 rows=r.map(function(x){return[String(x[0]==null?'':x[0]).trim(),String(x[1]==null?'':x[1]).trim(),String(x[2]==null?'':x[2]).trim().toUpperCase()]}).filter(function(x){return x[0]&&x[0]!=='0'});
 if(rows[0]&&/codice|material/i.test(rows[0][0]))rows.shift();
 o.innerHTML=rows.length?'<span class="ok">Letti '+rows.length+' materiali</span> da '+n+'. Esempio: '+rows.slice(0,2).map(function(x){return x.join(' / ')}).join(' | '):'<span class="err">Nessun materiale trovato nel file.</span>';
 d.disabled=!rows.length;
}
document.getElementById('f').onchange=function(e){
 var f=e.target.files[0];if(!f)return;var rd=new FileReader();o.textContent='Lettura in corso...';
 if(/\.csv$/i.test(f.name)){rd.onload=function(){done(csv(rd.result),f.name)};rd.readAsText(f)}
 else{rd.onload=function(){readXlsx(rd.result).then(function(r){done(r.rows,f.name+' (foglio '+r.sheet+')')}).catch(function(x){o.innerHTML='<span class="err">Impossibile leggere il file ('+x.message+'). Salvalo come CSV e riprova.</span>'})};rd.readAsArrayBuffer(f)}
};
d.onclick=function(){
 var js='window.ANAGRAFICA={aggiornata:'+JSON.stringify(new Date().toLocaleDateString('it-IT')+' '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}))+',rows:'+JSON.stringify(rows)+'};';
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));a.download='anagrafica.js';a.click();
};
</script><div style="text-align:center;font-size:12px;color:#6b7785;padding:14px 0">v 2.0 © BISBIGLIA FABIO</div>
</body></html>
